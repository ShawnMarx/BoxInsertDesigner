[[components.layout.tweaks.log]]
id = "r1793148985658"
text = """
This is the biggest issue with the design. The card holes at the bottom make sense for the upper rules tray, but not a deck card stack. 

See if you can design such as this with inner trays per deck so the whole thing doesn’t need to come out.

https://makerworld.com/en/models/1076662-forest-shuffle-custom-insert-base-expansions"""
status = "done"
created_ms = 1793148985658
updated_ms = 1793152578139
reply = "Reworked after your note on usability: the decks now sit in a floorless outer frame (158 x 214) with a lift-out holder per deck (73 x 96, 1.6 mm walls, open ends, floor window). Between the two rows of decks there's an 18.5 mm finger slot, and between the columns an 8.4 mm one, both cut down to a low bar so you can grip a holder's walls or a deck's end. The holders stand on the box floor, so the lid still sits only 2.6 mm high. Setting: 'Frame with holders' on this tray."
read_ms = 1793362445323

[[components.layout.tweaks]]
tray = "t-health"
pocket_labels = true

[components.layout.tweaks.pockets.health-dials]
scoop = false

[components.layout.tweaks.pockets.health-dials.notch]
width = 30.0
keep = 5.0

[components.layout.tweaks.pockets.villain-health-stand]
scoop = false
fill_spare = true

[components.layout.tweaks.pockets.villain-health-stand.notch]
width = 30.0
keep = 5.0

[[components.layout.tweaks.log]]
id = "r1793149122137"
text = "To make room if the cards need it, laying these sideways I think would probably help. We can just have an open filler space for the stand to go into."
status = "done"
created_ms = 1793149122137
updated_ms = 1793149744423
reply = "Done: the three dials now stand on edge side by side, in an 83 x 38 bin 40 mm deep (was 84 x 42 stacked flat). The stand gets an open 58 x 36 space at full depth beside them, plus the spare room left at the end of the tray. The tray is 158 x 52, which makes room for the deck holders. Everything still fits with the lid 2.6 mm high."
read_ms = 1793362173513

[[components.layout.tweaks.log]]
id = "r1793364930744"
text = "The Health dials bin should not have a curved bottom. Instead, there should be a 30 mm gap at the center on both sides from the top down to 5 mm above the floor."
status = "done"
created_ms = 1793364930744
updated_ms = 1793365146253
reply = "Done. The Health dials bin now has a flat floor (no scoop). A 30 mm slot runs through both long side walls at the bin's centre (x 28–58 mm), from the top down to 5 mm above the floor (7 mm up from the tray's base), so you can pinch the dials out. Nothing else in the tray changed: the stand and spare still have their scoops, the 'Health dials' floor label stays, and the tray is still 158 x 41 x 44. New per-bin settings: tweak_tray pocket=health-dials scoops=false notch=30 notch_keep=5."
read_ms = 1793365256729

[[components.layout.tweaks.log]]
id = "r1793365327464"
text = "For the villain stand - remove the empty bin and combine the two as one bin. No fillet bottom. Same 30mm style gaps as with health dial."
status = "done"
created_ms = 1793365327464
updated_ms = 1793365440507
reply = "Done. The empty spare bin is gone: the Villain Health stand's bin now runs to the end of the tray, 70.6 x 38 mm (was 58 x 38, plus an 11 mm spare). Its floor is flat (no scoop), and it has the same 30 mm slot through both long walls at its centre (x 106-137 mm), down to 5 mm above its floor. Bonus: its floor now has room for its label, 'Villain Health stand' at 5.5 mm. The tray's size is unchanged. New per-bin setting: fill_spare (take the leftover room instead of a spare)."
read_ms = 1793365580783

[[components.layout.tweaks.log]]
id = "r1793365594477"
text = "Relabel villain health stand as just stands"
status = "done"
created_ms = 1793365594477
updated_ms = 1793365966680
reply = "Done: the stand's pocket floor now reads 'Stands' (was 'Villain Health stand'). It fits at the full 8 mm capitals, 36 x 9 mm centred in the 69 x 36 mm clear floor, inlaid 0.6 mm like 'Health dials' beside it. The component's name is unchanged, so the app still lists it as Villain Health stand."
read_ms = 1793367494923

[[components.layout.tweaks.log]]
id = "r1793368279723"
text = """
Edited in SolidCraft (edit_diff has the details); make the tray do this:
- added Fillet1 (fillet) radius 2 mm on 4 edges
- body t-health: volume 40761 → 40610 mm³ (-0.4%)

All my tray outer four corners should have this same fillet"""
status = "done"
created_ms = 1793368279723
updated_ms = 1793368746419
reply = "Done, and on every tray: a new style rule (walls.corner_radius = 2 mm) rounds each tray's four outer vertical corners, as your SolidCraft edit did on this one. All 8 of this game's trays and the sample game's now build with 2 mm corners, and the layout still fits. On these 1.6 mm walls that leaves 1.43 mm at a pocket's square corner, above the 1.2 absolute minimum; the radius only shrinks on a tray whose walls are too thin to allow it. Change it with set_style walls.corner_radius=..."
read_ms = 1793368779026

[[components.layout.tweaks]]
tray = "t-tokens"
half_circle = "middle"
pocket_labels = true
order = [
    "5-token",
    "3-tokens",
    "1-tokens",
    "health-tracker",
]

[components.layout.tweaks.request]
id = "r1793368695844"
text = "I want this tray and the rules, villain cards tray to extend the full length of the box. they look just short"
status = "declined"
created_ms = 1793368695844
updated_ms = 1793369047579
reply = "Left at 250 mm, as you chose in the session: that is the longest tray the packer allows on the X1C bed with 3 mm clear of each edge, so Tokens and Rules and villain cards stop 5.4 mm short of the box's 255.4 mm. Printing to 0.3 mm from the bed edge would close the gap; ask if you want that later."

[[components.layout.tweaks.log]]
id = "a1793293457355"
text = "Add stencil text labels to the trays, this game as the test game: inlaid (own filament) and just cut."
status = "done"
created_ms = 1793293457355
updated_ms = 1793293457355
reply = "Labels inlaid in white (slot 2): 'Tokens' on top and each bin's name on its floor. Later reworked by your note."
direct = true

[[components.layout.tweaks.log]]
id = "r1793291371300"
text = """
On the -1 tokens, I don’t think making a narrower bin is right. Wider is better as it is easier to grab. When the full space isn’t needed -  better to keep the width and make it a little less deep instead.

Also, remove the middle generic tokens label

Make the token labels just be their values

Make the -1 tokens adj to the center instead of outer bin"""
status = "done"
created_ms = 1793291371300
updated_ms = 1793291905563
reply = "Done. The -1 bin is now full width (40 mm, like the others) and 10.5 mm deep instead of 12, so it holds the same. It sits next to the grab holes, so the order is -5, -3, grab holes, -1, Health tracker. The 'Tokens' label on top is gone, and the floors now read just -5, -3 and -1, inlaid at 8 mm. This is a general rule now: a bin narrower than its neighbours gets widened and made shallower. The Rules tray label is inlaid too, following your rule that labels printed flat get inlaid."
read_ms = 1793298515314

[[components.layout.tweaks]]
tray = "t-rules"
half_circle = "rules-and-villain-large-card-stack"
label = "Rules & villain cards"

[[components.layout.tweaks.log]]
id = "a1793293457401"
text = "Use the filled method when the label prints in a horizontal layer; engraved alone only for a vertically printed stencil."
status = "done"
created_ms = 1793293457401
updated_ms = 1793293457401
reply = "'Rules & villain cards' on the top switched from cut to inlaid (white, slot 2), 6.7 mm capitals."
direct = true

[[components.layout.tweaks]]
tray = "*"

[[components.layout.tweaks.log]]
id = "r1793369177158"
text = "Remove the labels on the deck boxes"
status = "done"
created_ms = 1793369177158
updated_ms = 1793369205615
reply = "Done: the four deck holders (Decks 1/4 to 4/4) no longer have labels; pocket labels are off on the deck frame. The other trays keep theirs (Health dials, Stands, Rules & villain cards, -5/-3/-1), and the layout still fits."
read_ms = 1793369512007

[[components.layout.tweaks.log]]
id = "r1793370061485"
text = "For the deck boxes, let's make the lip grips be on the tops and bottoms (so going towards the wider gap in the outer tray). This will give a bit more grabbing room. On the edges the grab lips were on previously, let's make card draw slots for both sides. This is 30mm wide gaps from the top, all the way to the bottom. Make the bottom have an inner eclipsed gap coming in (see Anachrony tray for the pioneer cards). No need for the bottom gap that currently exists in them."
status = "done"
created_ms = 1793370061485
updated_ms = 1793371212566
reply = "Done on all four deck holders. Lips: now on the end walls, facing the 12.7 mm gap between holders (the wider one; the side gap is 9 mm), 25 mm long and 4 mm deep. Card-draw slots: 30 mm wide, top to bottom, through both long walls where the lips were. Floor: the slots continue through it into a half-circle bite 14.75 mm deep, like the pioneer tray, and the old floor window is gone. The bite is 0.5 mm narrower than the slot: a bite exactly as wide, or elliptical, gives SolidCraft a broken mesh. Everything still fits, and the export passes the print checks. Set with tweak_tray tray=t-deck-tray pocket=decks notch=30 notch_keep=0 notch_floor=15."
read_ms = 1793373033587

