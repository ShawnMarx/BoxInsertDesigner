# BoxInsertDesigner game spec: the master copy. Edit through `bid` or the web app;
# hand edits are fine too (the server picks them up on the next command).

style = "default"

[game]
name = "CCG example"
sample = false
notes = "Box inside 160 x 257 x 62 (157 was a typo for 257: the board is 253 long). The folded board lies on top (8.3 mm top stack). Fits in 2 layers with the lid riding 2.6 mm above the rim (lid lift allowed up to 10 mm). The packer drops to minimum walls and floor (1.6 / 0.8 mm) to fit."

[printer]
name = "Bambu Lab X1C, 0.4 mm nozzle"
nozzle = 0.4
bed = [
    256.0,
    256.0,
]
max_z = 256.0
bed_margin = 3.0
layer_height = 0.2
line_width = 0.42
bed_exclude = [[
    0.0,
    0.0,
    18.0,
    28.0,
]]

[[sleeves]]
id = "penny"
name = "Penny sleeve (thin)"
per_card_mm = 0.4
source = "estimate"

[[sleeves]]
id = "premium"
name = "Premium sleeve (thick)"
per_card_mm = 0.55
source = "estimate"

